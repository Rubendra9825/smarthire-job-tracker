<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — SmartHire</title>
    <meta name="description" content="Create your free SmartHire account and start tracking job applications." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-page">

    <div class="auth-card" style="max-width:480px;">

        <!-- Logo -->
        <div class="auth-logo">
            <div class="brand-icon"><i class="bi bi-briefcase-fill"></i></div>
            <span>SmartHire</span>
        </div>

        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start tracking your job applications for free.</p>

        <!--
      Registration Form
      Stage 1: saves to localStorage and redirects.
      Stage 5: will POST to /api/auth/register
    -->
        <form id="registerForm" novalidate>

            <div class="form-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" class="form-control" placeholder="Alex Johnson" autocomplete="name"
                    required />
                <div id="nameError" class="field-error"
                    style="color:#ef4444;font-size:12.5px;margin-top:5px;display:none;">
                    Please enter your name.
                </div>
            </div>

            <div class="form-group">
                <label for="regEmail">Email address</label>
                <input type="email" id="regEmail" class="form-control" placeholder="you@example.com"
                    autocomplete="email" required />
                <div id="regEmailError" class="field-error"
                    style="color:#ef4444;font-size:12.5px;margin-top:5px;display:none;">
                    Enter a valid email address.
                </div>
            </div>

            <div class="form-row">
                <!-- Password -->
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div style="position:relative;">
                        <input type="password" id="regPassword" class="form-control" placeholder="Min. 8 characters"
                            autocomplete="new-password" required style="padding-right:44px;" />
                        <button type="button" id="toggleRegPass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                     background:none;border:none;cursor:pointer;color:var(--color-muted);font-size:17px;">
                            <i class="bi bi-eye-slash" id="regEyeIcon"></i>
                        </button>
                    </div>
                    <div id="passError" style="color:#ef4444;font-size:12.5px;margin-top:5px;display:none;"></div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="regConfirm">Confirm Password</label>
                    <input type="password" id="regConfirm" class="form-control" placeholder="Repeat password"
                        autocomplete="new-password" required />
                    <div id="confirmError" style="color:#ef4444;font-size:12.5px;margin-top:5px;display:none;">
                        Passwords do not match.
                    </div>
                </div>
            </div>

            <!-- Password strength meter -->
            <div style="margin-bottom:16px;">
                <div style="font-size:12px;color:var(--color-muted);margin-bottom:4px;" id="strengthLabel">Password
                    strength</div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" id="strengthBar" style="width:0%;"></div>
                </div>
            </div>

            <!-- Terms -->
            <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:20px;">
                <input type="checkbox" id="agreeTerms"
                    style="width:15px;height:15px;margin-top:2px;accent-color:var(--color-primary);flex-shrink:0;" />
                <label for="agreeTerms" style="font-size:13px;color:var(--color-muted);cursor:pointer;line-height:1.5;">
                    I agree to the
                    <a href="#" style="color:var(--color-primary);">Terms of Service</a> and
                    <a href="#" style="color:var(--color-primary);">Privacy Policy</a>
                </label>
            </div>
            <div id="termsError"
                style="color:#ef4444;font-size:12.5px;margin-top:-14px;margin-bottom:16px;display:none;">
                You must agree to the terms.
            </div>

            <button type="submit" class="btn-primary btn-full" id="registerBtn">
                <i class="bi bi-person-plus"></i> Create Account
            </button>

        </form>

        <p style="text-align:center;margin-top:20px;font-size:13.5px;color:var(--color-muted);">
            Already have an account?
            <a href="login.html" style="color:var(--color-primary);font-weight:600;">Log in</a>
        </p>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // ── PASSWORD SHOW / HIDE ───────────────────────────────────
        document.getElementById('toggleRegPass').addEventListener('click', () => {
            const input = document.getElementById('regPassword');
            const icon = document.getElementById('regEyeIcon');
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.className = input.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        // ── PASSWORD STRENGTH METER ───────────────────────────────
        document.getElementById('regPassword').addEventListener('input', () => {
            const val = document.getElementById('regPassword').value;
            let strength = 0;
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            const bar = document.getElementById('strengthBar');
            const label = document.getElementById('strengthLabel');
            const pct = (strength / 4) * 100;
            const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];

            bar.style.width = pct + '%';
            bar.style.background = colors[strength - 1] || '#e2e8f0';
            label.textContent = val.length ? 'Password strength: ' + (labels[strength - 1] || '') : 'Password strength';
        });

        const style = document.createElement('style');
        style.textContent = `@keyframes spin { to { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
    </script>

</body>

</html>
