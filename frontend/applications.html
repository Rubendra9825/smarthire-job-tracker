<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applications — SmartHire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- ── SIDEBAR ───────────────────────────────────────────── -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-briefcase-fill"></i></div>
            <span class="brand-name">SmartHire</span>
        </div>
        <div class="sidebar-label">Menu</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a href="applications.html"><i class="bi bi-card-list"></i> Applications</a>
            <a href="analytics.html"><i class="bi bi-bar-chart-line"></i> Analytics</a>
            <a href="resume-matcher.html"><i class="bi bi-robot"></i> Resume Matcher</a>
        </nav>
        <div class="sidebar-label">Account</div>
        <nav class="sidebar-nav">
            <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html"><i class="bi bi-box-arrow-left"></i> Log Out</a>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── MAIN CONTENT ──────────────────────────────────────── -->
    <div class="main-content">

        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
                <span class="topbar-title">Applications</span>
            </div>
            <div class="topbar-right">
                <div class="topbar-search">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" placeholder="Search applications…" />
                </div>
                <button class="user-btn">
                    <div class="user-avatar" id="topbarUserAvatar">AJ</div>
                    <span id="topbarUserName">Alex Johnson</span>
                    <i class="bi bi-chevron-down" style="font-size:12px;"></i>
                </button>
            </div>
        </header>

        <main class="page-content">

            <div class="page-header">
                <div>
                    <h1>My Applications</h1>
                    <p id="appCount" style="color:var(--color-muted);font-size:14px;">Loading…</p>
                </div>
                <button class="btn-primary" onclick="openAddModal()">
                    <i class="bi bi-plus-lg"></i> Add Application
                </button>
            </div>

            <!-- ── FILTER BAR ───────────────────────────────────────── -->
            <!--
      The filter bar has:
      - A search input    (id="appSearch")
      - A status dropdown (id="statusFilter")
      - View-toggle buttons (table vs card)
    -->
            <div class="filter-bar">
                <div class="filter-search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="appSearch" placeholder="Search company, role, location…" />
                </div>

                <select id="statusFilter" class="filter-select">
                    <option value="All">All Statuses</option>
                    <option value="Applied">Applied</option>
                    <option value="Assessment">Assessment</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <div class="view-toggle">
                    <button id="btnTableView" class="active" title="Table view">
                        <i class="bi bi-table"></i>
                    </button>
                    <button id="btnCardView" title="Card view">
                        <i class="bi bi-grid-3x3-gap"></i>
                    </button>
                </div>
            </div>

            <!-- ── TABLE VIEW ───────────────────────────────────────── -->
            <div id="tableView" class="card">
                <div class="card-body" style="padding:0;">
                    <table class="sh-table">
                        <thead>
                            <tr>
                                <th>Company</th>
                                <th>Role</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Applied On</th>
                                <th>Salary</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appsTableBody">
                            <tr>
                                <td colspan="7" style="text-align:center;padding:40px;color:var(--color-muted);">
                                    Loading applications…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ── CARD VIEW ────────────────────────────────────────── -->
            <!-- Hidden by default, shown when user clicks the grid icon -->
            <div id="cardView" class="apps-grid" style="display:none;">
                <!-- Filled by applications.js -->
            </div>

        </main>
    </div>

    <!-- ══════════════════════════════════════════════════════════
     ADD / EDIT APPLICATION MODAL
     ══════════════════════════════════════════════════════════
     This modal appears over the page when you click:
     - "Add Application"  → opens empty form
     - "Edit" on a row   → opens form filled with existing data
-->
    <div class="modal-overlay" id="appModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Add Application</h3>
                <button class="modal-close" onclick="closeModal('appModal')">&times;</button>
            </div>

            <div class="modal-body">
                <form id="appForm" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fieldCompany">Company *</label>
                            <input type="text" id="fieldCompany" class="form-control" placeholder="e.g. Google"
                                required />
                        </div>
                        <div class="form-group">
                            <label for="fieldTitle">Job Title *</label>
                            <input type="text" id="fieldTitle" class="form-control" placeholder="e.g. Software Engineer"
                                required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fieldLocation">Location</label>
                            <input type="text" id="fieldLocation" class="form-control"
                                placeholder="e.g. Bangalore, India" />
                        </div>
                        <div class="form-group">
                            <label for="fieldJobType">Job Type</label>
                            <select id="fieldJobType" class="form-control">
                                <option>Full-time</option>
                                <option>Internship</option>
                                <option>Part-time</option>
                                <option>Contract</option>
                                <option>Remote</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fieldSalary">Salary / Stipend</label>
                            <input type="text" id="fieldSalary" class="form-control" placeholder="e.g. ₹15 LPA" />
                        </div>
                        <div class="form-group">
                            <label for="fieldDate">Application Date *</label>
                            <input type="date" id="fieldDate" class="form-control" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fieldStatus">Status</label>
                            <select id="fieldStatus" class="form-control">
                                <option>Applied</option>
                                <option>Assessment</option>
                                <option>Interview</option>
                                <option>Offer</option>
                                <option>Rejected</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="fieldInterview">Interview Date</label>
                            <input type="date" id="fieldInterview" class="form-control" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fieldUrl">Job URL</label>
                        <input type="url" id="fieldUrl" class="form-control"
                            placeholder="https://careers.company.com/job/…" />
                    </div>

                    <div class="form-group">
                        <label for="fieldNotes">Notes</label>
                        <textarea id="fieldNotes" class="form-control"
                            placeholder="Referral, interview tips, round details…"></textarea>
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('appModal')">Cancel</button>
                <button class="btn-primary" onclick="document.getElementById('appForm').requestSubmit()">
                    <i class="bi bi-floppy"></i> Save Application
                </button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/applications.js"></script>
</body>

</html>
